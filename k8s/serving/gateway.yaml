apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: vision-gateway:dev
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: TRITON_URL
              value: "http://triton.serving.svc.cluster.local:8000"
            - name: CANARY_PERCENT
              value: "10"
            - name: MINIO_ENDPOINT
              value: "http://minio.data.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "raw-images"
          envFrom:
            - secretRef:
                name: gateway-secrets
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: serving
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000