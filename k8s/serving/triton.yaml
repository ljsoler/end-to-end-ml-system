apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: serving
spec:
  replicas: 1
  progressDeadlineSeconds: 900   # 30 minutes
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:23.08-py3
          args:
            - "tritonserver"
            - "--model-repository=/models"
            - "--http-port=8000"
            - "--grpc-port=8001"
            - "--metrics-port=8002"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-repo
              mountPath: /models
      volumes:
        - name: model-repo
          hostPath:
            path: /models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: serving
  labels:
    app: triton    # 🔥 THIS IS THE FIX
spec:
  selector:
    app: triton
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton-hpa
  namespace: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: triton
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60