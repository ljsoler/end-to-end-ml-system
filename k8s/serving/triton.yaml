apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:23.08-py3
          args:
            - tritonserver
            # ✅ MinIO host:port embedded in s3:// URL
            - --model-repository=s3://minio.data.svc.cluster.local:9000/triton-models
            - --http-port=8000
            - --grpc-port=8001
            - --metrics-port=8002
            - --model-control-mode=poll
            - --repository-poll-secs=15
            - --log-verbose=1
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: triton-s3
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: triton-s3
                  key: secret_key
            # ✅ SDK uses AWS_REGION
            - name: AWS_REGION
              value: us-east-1
            # (optional but nice)
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: serving
  labels:
    app: triton
spec:
  selector:
    app: triton
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002